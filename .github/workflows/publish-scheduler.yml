name: Publish Scheduled Articles

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC daily = 10:00 Cairo (EET)
  workflow_dispatch:

# Same group as automation.yml: only one job commits to main at a time
concurrency:
  group: swr-main-commits
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread requests

      - name: Run publish scheduler
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/publish_scheduler.py

      - name: Commit and push published articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ sitemap.xml
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "publish: scheduled articles $(date +%Y-%m-%d)"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $i failed, retrying"
              sleep $((i * 5))
            done
            echo "push failed after 3 attempts"
            exit 1
          fi
